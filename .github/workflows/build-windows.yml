name: Build Windows Installer

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install customtkinter requests pillow
        pip install -r requirements.txt || echo "Some requirements may not be needed"
        
    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name humanaize2 --icon=installer/windows/icon.ico --add-data "src/ui/ascii.txt;src/ui" --add-data "src/Prompt;src/Prompt" --add-data "skills;skills" --add-data "config;config" --hidden-import customtkinter --hidden-import requests --hidden-import PIL src/core/main.py
        
    - name: Create installer directory
      run: |
        if (Test-Path installer_output) { Remove-Item -Recurse -Force installer_output }
        mkdir installer_output
        mkdir installer_output\humanaize2
        
    - name: Copy files
      run: |
        copy dist\humanaize2.exe installer_output\humanaize2\
        copy README.md installer_output\humanaize2\
        xcopy /E /I skills installer_output\humanaize2\skills
        xcopy /E /I config installer_output\humanaize2\config
        
    - name: Create ZIP archive
      run: |
        cd installer_output
        7z a -tzip humanaize2-windows.zip humanaize2
        move humanaize2-windows.zip ..
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: humanaize2-windows
        path: humanaize2-windows.zip
        
    - name: Create Release (if tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: humanaize2-windows.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}